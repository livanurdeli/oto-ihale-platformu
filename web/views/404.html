{{define "content"}}
<div style="max-width: 550px; margin: 3rem auto; text-align: center;">
  <div style="background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 3rem 2rem; border: 1px solid #e2e8f0;">
    <div style="font-size: 4rem; margin-bottom: 1rem;">🔍</div>
    <div style="display: inline-block; background: #e0f2fe; color: #0369a1; font-weight: 800; font-size: 0.85rem; padding: 4px 14px; border-radius: 20px; text-transform: uppercase; margin-bottom: 1rem;">
      HTTP 404 Sayfa Bulunamadı
    </div>
    <h1 style="font-size: 1.8rem; font-weight: 800; color: #0f172a; margin-bottom: 0.75rem;">
      Aradığınız İlan veya Sayfa Bulunamadı
    </h1>
    <p style="color: #64748b; font-size: 0.98rem; line-height: 1.6; margin-bottom: 2rem;">
      Ulaşmaya çalıştığınız ilan silinmiş, yayından kaldırılmış veya bağlantı adresi hatalı olabilir.
    </p>

    <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
      <a href="/listings" class="btn btn-primary">
        🚗 İlan Listesine Git
      </a>
      <a href="/" class="btn btn-secondary">
        🏠 Ana Sayfa
      </a>
    </div>
  </div>
</div>
{{end}}
