{{define "content"}}
<div style="max-width: 550px; margin: 3rem auto; text-align: center;">
  <div style="background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 3rem 2rem; border: 1px solid #e2e8f0;">
    <div style="font-size: 4rem; margin-bottom: 1rem;">🚫</div>
    <div style="display: inline-block; background: #fee2e2; color: #b91c1c; font-weight: 800; font-size: 0.85rem; padding: 4px 14px; border-radius: 20px; text-transform: uppercase; margin-bottom: 1rem;">
      HTTP 403 Forbidden
    </div>
    <h1 style="font-size: 1.8rem; font-weight: 800; color: #0f172a; margin-bottom: 0.75rem;">
      Yetkisiz Erişim (Sayfa Korumalı)
    </h1>
    <p style="color: #64748b; font-size: 0.98rem; line-height: 1.6; margin-bottom: 2rem;">
      Bu sayfaya yalnızca <strong>yönetici (admin)</strong> yetkisine sahip kullanıcılar erişebilir. Mevcut hesabınızın bu alanı görüntüleme izni bulunmamaktadır.
    </p>

    <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
      <a href="/dashboard" class="btn btn-primary">
        👤 Kullanıcı Panelime Dön
      </a>
      <a href="/" class="btn btn-secondary">
        🏠 Ana Sayfa
      </a>
    </div>
  </div>
</div>
{{end}}
