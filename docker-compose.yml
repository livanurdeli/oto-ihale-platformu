services:
  postgres:
    image: postgres:16-alpine
    container_name: car_auction_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-car_auction_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-car_auction_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Mikroservis 1: Web & API Gateway Servisi
  web:
    build: .
    container_name: car_auction_web
    restart: unless-stopped
    command: ["/app/server"]
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-car_auction_db}?sslmode=disable
      - SERVER_PORT=8080
      - SERVER_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  # Mikroservis 2: Açık Artırma Arka Plan Motoru (Auction Worker Microservice)
  auction-worker:
    build: .
    container_name: car_auction_worker
    restart: unless-stopped
    command: ["/app/auction-worker"]
    environment:
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-car_auction_db}?sslmode=disable
      - SERVER_ENV=development
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
